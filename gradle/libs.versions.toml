[versions]
enonic-defaults = "2.1.7"
jmustache = "1.16"
junit = "6.1.3"
mockito = "5.23.0"
node-gradle = "7.1.0"

[plugins]
enonic-defaults = { id = "com.enonic.defaults", version.ref = "enonic-defaults" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }

[libraries]
jmustache = { module = "com.samskivert:jmustache", version.ref = "jmustache" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-bom = { module = "org.mockito:mockito-bom", version.ref = "mockito" }
mockito-core = { module = "org.mockito:mockito-core" }
